<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a63"><link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lémou et Touty</title>
<style>
:root{--nv:#0b2a63;--gold:#d49a2a;--ink:#15233f;--mu:#6b7280;--ln:#e6eaf2;--bl:#eef3fb}
*{box-sizing:border-box}
body{margin:0;background:var(--nv);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;display:flex;gap:12px;align-items:center;color:#fff}
header b{font:700 22px Georgia,serif;color:#e8b84a;flex:1;line-height:1.1}
#av{width:42px;height:42px;border-radius:50%;background:#e8b84a;color:var(--nv);display:grid;place-items:center;font-weight:700}#av:empty{display:none}
#ios{max-width:720px;margin:0 auto 8px;padding:0 18px;color:#fff;font-size:14px}
main{background:#fff;border-radius:30px 30px 0 0;max-width:720px;margin:0 auto;padding:22px 18px 110px;min-height:75vh}
h2{margin:.2em 0}h3{margin:1.3em 0 .6em;font-size:18px}
input,textarea{width:100%;padding:13px 15px;margin:0 0 10px;border:1px solid var(--ln);border-radius:16px;font:inherit;background:#fafbfd}
button{background:var(--nv);color:#fff;border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:600;cursor:pointer}
button.full{width:100%}button.sm{padding:8px 14px;font-size:14px}
button.alt{background:#fff;color:var(--nv);border:1.5px solid var(--nv)}button.gold{background:var(--gold)}
button.ok{background:#e1f5ea;color:#1b8a4e}button.red{background:#b42318;margin-top:24px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tile{background:var(--bl);border-radius:18px;padding:14px 6px;text-align:center}.tile b{display:block;font-size:22px}.tile small{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--ln)}
.card{border:1px solid var(--ln);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0b2a6310}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:#e1f5ea;color:#1b8a4e}.pill.w{background:#fdf0d5;color:#9a6a10}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--nv);border-radius:9px}
.avb{width:90px;height:90px;border-radius:50%;background:var(--nv);color:#e8b84a;display:grid;place-items:center;font:700 30px Georgia,serif;margin:8px auto}
.mu{color:var(--mu)}a{color:var(--nv);font-weight:600;cursor:pointer}a.del{color:#b42318}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}.tabs button{background:var(--bl);color:var(--mu);padding:10px 16px;white-space:nowrap;border-radius:99px}.tabs .on{background:var(--nv);color:#fff}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;display:block;overflow-x:auto}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -4px 18px #0b2a6322;border-radius:22px 22px 0 0;z-index:5}
#nav a{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mu);min-width:70px}#nav a.on{color:var(--nv)}#nav span{font-size:20px}
</style></style></head><body>
<header><img src="logo-192.png" alt="" width="42" height="42" style="border-radius:50%"><b id="nm"></b><button id="inst" class="gold sm" hidden>Installer</button><div id="av"></div></header><nav id="nav"></nav>
<p id="ios" hidden>iPhone : ouvre dans Safari, touche « Partager », puis « Sur l’écran d’accueil ».</p>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== RÉGLAGES (un seul endroit) ===== */
const CFG={url:"https://fyqyzzgygsstmqvnasps.supabase.co",key:"sb_publishable_ex-1Mrg3qfgwAbaSeFwCQQ_3G2Uq8p4",name:"Lémou et Touty",vapid:"BCkPa_Cx91QddcV3zW_9UffcVId7BuV_kOJRTlI-kTZp4ub3Dfkq-CkE6zJH06U34UyV0BYXbDHXWlR9JT2GyzM"};
/* ====================================== */
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),app=$("#app");
let me=null,view="home",gid=null,tab="ann",mo=new Date().toISOString().slice(0,7);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const run=async p=>{const{data,error}=await p;if(error){alert(error.message);return null}return data??true};
const isA=()=>me&&me.role!="user",go=(v,g)=>{view=v;if(g){gid=g;tab="cot"}render()};
async function boot(){const{data:{session}}=await sb.auth.getSession();
 if(!session){me=null;$("#nav").innerHTML="";$("#av").textContent="";return authView()}
 me=await run(sb.from("profiles").select("id,full_name,role").eq("id",session.user.id).single());render()}
const ini=n=>(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function authView(m){if(!m){app.innerHTML=`<div style="text-align:center;padding-top:8px"><img src="logo-512.png" alt="" width="190" style="border-radius:50%"><h2 style="font:700 28px Georgia,serif;color:var(--nv);margin-top:12px">${CFG.name}</h2><p class="mu">Une famille, une force.</p><p>Gestion de groupes, de membres et de cotisations en toute simplicité.</p></div><button class="full" onclick="authView('in')">Se connecter</button><br><br><button class="alt full" onclick="authView('up')">Créer un compte</button>`;return}
 const up=m=="up";app.innerHTML=`<a onclick="authView()">← Retour</a><h2>${up?"Créer un compte":"Connexion"}</h2>${up?`<input id="pn" placeholder="Prénom"><input id="n" placeholder="Nom">`:""}<input id="e" type="email" placeholder="E-mail"><input id="p" type="password" placeholder="Mot de passe"><button class="full" id="go1">${up?"Créer un compte":"Se connecter"}</button>`;
 $("#go1").onclick=async()=>{let r;if(up){const f=$("#pn").value.trim(),l=$("#n").value.trim();if(!f||!l)return alert("Le prénom et le nom sont obligatoires.");r=await sb.auth.signUp({email:$("#e").value,password:$("#p").value,options:{data:{first_name:f,last_name:l}}})}else r=await sb.auth.signInWithPassword({email:$("#e").value,password:$("#p").value});r.error?alert(r.error.message):boot()}}
function render(){if(!me)return;$("#av").textContent=ini(me.full_name);
 $("#nav").innerHTML=`<a class="${view=="home"||view=="group"?"on":""}" onclick="go('home')"><span>🏠</span>Accueil</a>${isA()?`<a class="${view=="admin"?"on":""}" onclick="go('admin')"><span>🛡️</span>Administration</a>`:""}<a class="${view=="profil"?"on":""}" onclick="go('profil')"><span>👤</span>Profil</a>`;
 ({home,group,admin,profil})[view]()}
async function profil(){const[u,p]=await Promise.all([sb.auth.getUser(),run(sb.rpc("my_profile"))]);const em=u.data.user?.email||"",q=(Array.isArray(p)&&p[0])||{},nm=(me.full_name||"").split(" ");
 app.innerHTML=`<div style="text-align:center"><div class="avb">${ini(me.full_name)}</div><h2>${esc(me.full_name)}</h2><span class="pill">${me.role=="main_admin"?"Administrateur principal":me.role=="admin"?"Administrateur":"Membre actif"}</span></div>
<h3>Mes informations</h3><input id="pf" placeholder="Prénom" value="${esc(q.first_name||nm[0])}"><input id="pl" placeholder="Nom" value="${esc(q.last_name||nm.slice(1).join(" "))}"><input id="pt" type="tel" placeholder="Téléphone (ex. +221 77 123 45 67)" value="${esc(q.phone)}"><button class="gold full" id="ps">Enregistrer</button>
<h3>Adresse e-mail</h3><input id="pe" type="email" value="${esc(em)}"><button class="alt full" id="pm">Changer mon e-mail</button><p class="mu">Un e-mail de confirmation peut être envoyé à la nouvelle adresse.</p>
<h3>Notifications</h3><p class="mu">Reçois une alerte pour les annonces, la validation de ton groupe et ton rôle d’administrateur. Sur iPhone, installe d’abord l’app sur l’écran d’accueil.</p><button class="gold full" onclick="pushOn()">Activer les notifications</button><br><br><button class="alt full" style="border-color:var(--gold);color:var(--gold)" onclick="sb.auth.signOut().then(boot)">Se déconnecter</button>`;
 $("#ps").onclick=async()=>{if(await run(sb.rpc("update_profile",{p_first:$("#pf").value,p_last:$("#pl").value,p_phone:$("#pt").value}))){alert("Informations enregistrées.");boot()}};
 $("#pm").onclick=async()=>{const{error}=await sb.auth.updateUser({email:$("#pe").value.trim()});alert(error?error.message:"Demande envoyée. Vérifie ta boîte e-mail si une confirmation est demandée.")}}
async function home(){const r=await run(sb.from("group_members").select("status,groups(id,name,description,owner_id,status)").eq("user_id",me.id));const gs=(Array.isArray(r)?r:[]).filter(m=>m.groups),ow=gs.filter(m=>m.groups.owner_id==me.id).length,pe=gs.filter(m=>m.status!="active"||m.groups.status!="approved").length,pr=(me.full_name||"").split(" ")[0];
 app.innerHTML=`<h2>Bonjour, ${esc(pr)} 👋</h2><p class="mu" style="margin:0">Que souhaitez-vous faire aujourd’hui ?</p>
<div class="tiles"><div class="tile"><b>${gs.length}</b><small>Groupes</small></div><div class="tile"><b>${ow}</b><small>Responsable</small></div><div class="tile"><b>${pe}</b><small>En attente</small></div></div>
<h3>Mes groupes</h3>${gs.map(m=>{const g=m.groups,ok=m.status=="active"&&g.status=="approved";return`<div class="card" ${ok?`onclick="go('group','${g.id}')" style="cursor:pointer"`:""}><div class="row" style="border:0;padding:0"><b>${esc(g.name)}</b><span class="pill ${ok?"":"w"}">${g.status!="approved"?"En attente de validation":m.status!="active"?"Demande en attente":g.owner_id==me.id?"Responsable":"Membre"}</span></div><small class="mu">${esc(g.description)}</small></div>`}).join("")||`<p class="mu">Aucun groupe. Crée le tien ou rejoins-en un avec un code.</p>`}
<h3>Créer un groupe</h3><input id="gn" placeholder="Nom du groupe"><input id="gd" placeholder="Description"><button class="gold full" id="gc">+ Créer un groupe</button>
<h3>Rejoindre un groupe</h3><input id="gk" placeholder="Code du groupe"><button class="alt full" id="gj">Envoyer la demande</button>`;
 $("#gc").onclick=async()=>{const id=await run(sb.rpc("create_group",{p_name:$("#gn").value,p_desc:$("#gd").value}));if(id){if(isA())go("group",id);else{alert("Groupe envoyé. Il sera visible après validation par l’administrateur.");home()}}};
 $("#gj").onclick=async()=>{if(await run(sb.rpc("join_group",{p_code:$("#gk").value}))){alert("Demande envoyée au responsable.");home()}}}
async function group(){const g=await run(sb.from("groups").select("*").eq("id",gid).single());if(!g)return go("home");
 const own=g.owner_id==me.id,adm=own||isA();if(tab=="ana"&&!adm)tab="cot";
 const[ms,cs]=await Promise.all([run(sb.from("group_members").select("user_id").eq("group_id",gid).eq("status","active")),run(sb.from("contributions").select("amount,paid").eq("group_id",gid).eq("month",mo+"-01"))]);
 const n=Array.isArray(ms)?ms.length:0,cl=Array.isArray(cs)?cs:[],pd=cl.filter(x=>x.paid).length,am=cl[0]?.amount||0;
 app.innerHTML=`<a onclick="go('home')">← Retour</a><div style="text-align:center"><h2>${esc(g.name)}</h2><p class="mu" style="margin:0">${esc(g.description)}</p><p class="mu">Code d’invitation : <b>${g.code}</b></p></div>
<div class="tiles"><div class="tile"><b>${n}</b><small>Membres</small></div><div class="tile"><b>${am}</b><small>FCFA / mois</small></div><div class="tile"><b>${pd}/${n}</b><small>Payés</small></div></div>
<div class="card"><div class="row" style="border:0;padding:0"><b>Progression du mois</b><span>${pd} / ${n} payés</span></div><div class="bar"><i style="width:${n?pd/n*100:0}%"></i></div></div>
<div class="tabs">${[["cot","Cotisations"],["mem","Membres"],["ann","Annonces"],...(adm?[["ana","Analyse"]]:[])].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';group()">${l}</button>`).join("")}</div><div id="t"></div>${adm?`<button class="red full" onclick="delG()">Supprimer le groupe</button>`:`<button class="alt full" style="margin-top:24px" onclick="leave()">Quitter le groupe</button>`}`;
 await({ann,mem,cot,ana})[tab](g,own)}
const b64=t=>Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function pushOn(){if(!("serviceWorker"in navigator&&"PushManager"in window))return alert("Notifications indisponibles ici. Sur iPhone, installe d’abord l’app sur l’écran d’accueil.");
 if(await Notification.requestPermission()!="granted")return alert("Notifications refusées. Autorise-les dans les réglages du navigateur.");
 const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)}),j=sub.toJSON();
 if(await run(sb.rpc("save_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth})))alert("Notifications activées ✅")}
const notify=async(kind,ref)=>{try{const{data:{session}}=await sb.auth.getSession();await fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({kind,ref})})}catch(e){}};
async function leave(){if(confirm("Quitter ce groupe ?")&&await run(sb.from("group_members").delete().eq("group_id",gid).eq("user_id",me.id)))go("home")}
async function ann(g,own){const a=await run(sb.from("announcements").select("*").eq("group_id",gid).order("created_at",{ascending:false}));
 $("#t").innerHTML=(own?`<input id="at" placeholder="Titre"><textarea id="ab" placeholder="Message"></textarea><button onclick="addA()">Publier l’annonce</button>`:"")+((a&&a!==true?a:[]).map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.body)}</p><small class="mu">${new Date(x.created_at).toLocaleDateString("fr-FR")}</small> ${own?`<a class="del" onclick="delA('${x.id}')">Supprimer</a>`:""}</div>`).join("")||`<p class="mu">Aucune annonce.</p>`)}
async function addA(){const r=await run(sb.from("announcements").insert({group_id:gid,title:$("#at").value,body:$("#ab").value}).select("id").single());if(r){if(r.id)notify("announcement",r.id);group()}}
async function delA(i){if(await run(sb.from("announcements").delete().eq("id",i)))group()}
async function mem(g,own){const m=await run(sb.from("group_members").select("user_id,status,profiles(full_name)").eq("group_id",gid)),adm=own||isA();
 $("#t").innerHTML=(Array.isArray(m)?m:[]).map(x=>`<div class="row"><span>${esc(x.profiles?.full_name||"Membre")}${x.status=="pending"?` <span class="pill w">demande</span>`:""}</span>${adm&&x.user_id!=g.owner_id?(x.status=="pending"?(own?`<span><a onclick="setM('${x.user_id}')">Accepter</a> <a class="del" onclick="rmM('${x.user_id}')">Refuser</a></span>`:""):`<a class="del" onclick="rmM('${x.user_id}')">Retirer</a>`):""}</div>`).join("")||`<p class="mu">Aucun membre.</p>`}
async function setM(u){if(await run(sb.from("group_members").update({status:"active",joined_at:new Date().toISOString()}).eq("group_id",gid).eq("user_id",u)))group()}
async function rmM(u){if(await run(sb.from("group_members").delete().eq("group_id",gid).eq("user_id",u)))group()}
async function cot(g,own){const[m,c]=await Promise.all([run(sb.from("group_members").select("user_id,profiles(full_name)").eq("group_id",gid).eq("status","active")),run(sb.from("contributions").select("*").eq("group_id",gid).eq("month",mo+"-01"))]);
 const L=x=>Array.isArray(x)?x:[],by=Object.fromEntries(L(c).map(x=>[x.user_id,x]));
 $("#t").innerHTML=`<input type="month" value="${mo}" onchange="mo=this.value;group()">${own?`<input id="am" type="number" placeholder="Montant de la cotisation (FCFA)" value="${L(c)[0]?.amount||""}">`:""}`+L(m).map(x=>{const p=by[x.user_id]?.paid;return`<div class="row"><span>${esc(x.profiles?.full_name||"Membre")}</span>${own?`<button class="${p?"ok":"alt"}" onclick="pay('${x.user_id}',${!p})">${p?"Payé":"Non payé"}</button>`:`<b>${p?"Payé":"Non payé"}</b>`}</div>`}).join("")}
async function pay(u,p){if(await run(sb.from("contributions").upsert({group_id:gid,user_id:u,month:mo+"-01",amount:+$("#am").value||0,paid:p},{onConflict:"group_id,user_id,month"})))group()}
function line(d,k,t){const mx=Math.max(1,...d.map(x=>+x[k])),p=d.map((x,i)=>`${i*300/(d.length-1)},${100-x[k]/mx*100}`).join(" ");
 return`<div class="card"><b>${t}</b><svg viewBox="-5 -5 310 110" width="100%"><polyline points="${p}" fill="none" stroke="#d4a537" stroke-width="3"/></svg><div class="mu" style="display:flex;justify-content:space-between"><small>${d[0].r_month}</small><small>max ${mx}</small><small>${d.at(-1).r_month}</small></div></div>`}
function stats(d,ks){if(!Array.isArray(d))return"";return ks.map(([k,t])=>line(d,k,t)).join("")+`<table><tr><th>Mois</th>${ks.map(k=>`<th>${k[1]}</th>`).join("")}</tr>${d.map(x=>`<tr><td>${x.r_month}</td>${ks.map(k=>`<td>${x[k[0]]}</td>`).join("")}</tr>`).join("")}</table>`}
async function ana(){$("#t").innerHTML=stats(await run(sb.rpc("monthly_stats",{gid})),[["r_members","Nouveaux membres"],["r_paid","Cotisations payées (FCFA)"]])}
async function delG(){if(!confirm("Supprimer définitivement ce groupe et ses données ?"))return;if(await run(sb.from("groups").delete().eq("id",gid)))go(view=="admin"?"admin":"home")}
async function admin(){const[ad,gs,st]=await Promise.all([run(sb.rpc("admin_list")),run(sb.from("groups").select("id,name,code,status")),run(sb.rpc("monthly_stats",{gid:null}))]);const L=x=>Array.isArray(x)?x:[],M=me.role=="main_admin",P=L(gs).filter(g=>g.status=="pending"),A=L(gs).filter(g=>g.status=="approved");
 app.innerHTML=`<h2>Administration</h2><h3>Groupes à valider (${P.length})</h3>${P.map(g=>`<div class="row"><span>${esc(g.name)}</span><span><a onclick="okG('${g.id}')">Valider</a> <a class="del" onclick="gid='${g.id}';delG()">Refuser</a></span></div>`).join("")||`<p class="mu">Aucun groupe en attente.</p>`}
<h3>Administrateurs</h3>${L(ad).map(a=>`<div class="row"><span>${esc(a.email)}</span>${a.role=="main_admin"?"<b>Principal</b>":M?`<a class="del" onclick="rmAd('${a.id}')">Retirer</a>`:"<span>Admin</span>"}</div>`).join("")}
${M?`<input id="ae" type="email" placeholder="E-mail du nouvel administrateur"><button onclick="addAd()">Ajouter un administrateur</button><p class="mu">Sans compte, la personne devient admin dès son inscription.</p>`:""}
<h3>Groupes validés</h3>${A.map(g=>`<div class="row"><a onclick="go('group','${g.id}')">${esc(g.name)}</a><a class="del" onclick="gid='${g.id}';delG()">Supprimer</a></div>`).join("")||`<p class="mu">Aucun groupe.</p>`}
<h3>Analyse globale</h3>${stats(st,[["r_members","Nouveaux membres"],["r_groups","Groupes créés"],["r_paid","Cotisations payées (FCFA)"]])}`}
async function okG(i){if(await run(sb.from("groups").update({status:"approved"}).eq("id",i))){notify("group_approved",i);admin()}}
async function addAd(){const em=$("#ae").value.trim();if(await run(sb.rpc("add_admin",{p_email:em}))){notify("admin_added",em);admin()}}
async function rmAd(i){if(confirm("Retirer cet administrateur ?")&&await run(sb.rpc("remove_admin",{p_id:i})))admin()}
let ip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("#inst").hidden=false});$("#inst").onclick=()=>ip&&ip.prompt();
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$("#ios").hidden=false;
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
document.title=CFG.name;$("#nm").textContent=CFG.name;boot();
</script></body></html>
